name: Continuos Integration
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: build
        run: npm run build

  test_unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: npm ci

      - name: test
        run: npm run test:unit:ci

      - name: issue badge
        run: |
          mkdir -p .github/pages/badges
          npx make-coverage-badge --report-path .coverage/coverage-summary.json --output-path .github/pages/badges/coverage.badge.svg

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-badge-artifact
          path: .github/pages/badges/coverage.badge.svg

  test_perf:
    name: Performance Tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: npm ci

      - name: test
        id: perf_test
        run: |
          npm run test:perf:ci

      - name: attach report
        if: github.event.number
        uses: thollander/actions-comment-pull-request@v2
        with:
          pr_number: ${{ github.event.number }}
          filePath: .benchmark
          mode: recreate
          comment_tag: benchmark_comment
          create_if_not_exists: true

  test_visual:
    name: Visual Tests
    permissions:
      pull-requests: write
      contents: read
    uses: ./.github/workflows/visual-tests-only.yml
    with:
      pr_number: ${{ github.event.number }}
      ref: ${{ github.sha }}
      event_name: ${{ github.event_name }}
    secrets: inherit

  test_eslint:
    name: Eslint Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: npm ci

      - name: test
        run: npm run test:eslint-rules:ci

  test-breaking-changes:
    name: Test Breaking Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to post comments on the PR

    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Needed so we can fetch/checkout main easily

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Breaking Change Report
        run: |
          npm run test:breaking-changes

      - name: Annotate Source Files and Collect Changes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');

            const diffPath = 'test-results/backward-compatibility/reports/api-diff-report.md';
            if (!fs.existsSync(diffPath)) {
              core.exportVariable('HAS_API_CHANGES', 'false');
              return;
            }

            const apiDiffText = fs.readFileSync(diffPath, 'utf8');
            if (!apiDiffText || apiDiffText.trim() === '') {
              core.exportVariable('HAS_API_CHANGES', 'false');
              return;
            }

            const addedApiLines = new Set();
            for (const line of apiDiffText.split('\n')) {
              if (line.startsWith('+') && !line.startsWith('+++')) {
                const content = line.substring(1).trim();
                if (content && content !== '{' && content !== '}' && content.length > 3) {
                  addedApiLines.add(content);
                }
              }
            }

            if (addedApiLines.size === 0) {
              core.exportVariable('HAS_API_CHANGES', 'false');
              return;
            }

            const gitDiff = cp.execSync('git diff -U0 origin/main...HEAD -- src/').toString();
            let currentFile = '';
            let currentNewLine = 0;
            const annotatedItems = [];

            for (const line of gitDiff.split('\n')) {
              if (line.startsWith('+++ b/')) {
                currentFile = line.substring(6).trim();
              } else if (line.startsWith('@@')) {
                const match = line.match(/\+(\d+)(?:,\d+)?\s@@/);
                if (match) {
                  currentNewLine = parseInt(match[1], 10) - 1;
                }
              } else if (line.startsWith('+') && !line.startsWith('+++')) {
                currentNewLine++;
                const sourceLine = line.substring(1).trim();
                
                for (const apiLine of addedApiLines) {
                  if (sourceLine.includes(apiLine) || apiLine.includes(sourceLine)) {
                    const annotationMsg = `API contract change introduced: \`${sourceLine}\`. Ensure backwards compatibility.`;
                    
                    core.warning(annotationMsg, {
                      file: currentFile,
                      startLine: currentNewLine,
                      title: '⚠️ API Breaking Change'
                    });

                    annotatedItems.push({ file: currentFile, line: currentNewLine, code: sourceLine });
                    break;
                  }
                }
              } else if (!line.startsWith('-')) {
                if (currentNewLine > 0) currentNewLine++;
              }
            }

            // Save payload to a temporary file for the next step
            fs.writeFileSync('api-changes-summary.json', JSON.stringify({
              items: annotatedItems,
              fullDiff: apiDiffText
            }, null, 2));

            core.exportVariable('HAS_API_CHANGES', annotatedItems.length > 0 ? 'true' : 'false');

      - name: Post or Update PR Summary Comment
        if: env.HAS_API_CHANGES == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('api-changes-summary.json')) return;
            const data = JSON.parse(fs.readFileSync('api-changes-summary.json', 'utf8'));

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            let summaryBody = `### ⚠️ API Breaking Changes Detected\n\n` +
              `This Pull Request modifies public API contracts. Please check the **Files Changed** tab for inline warnings on the following lines:\n\n`;

            for (const item of data.items) {
              summaryBody += `- **\`${item.file}\`** (Line ${item.line}): \`${item.code}\`\n`;
            }

            summaryBody += `\n<details><summary>View Full API Diff Report</summary>\n\n\`\`\`diff\n${data.fullDiff}\n\`\`\`\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(c => c.body && c.body.includes('### ⚠️ API Breaking Changes Detected'));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: summaryBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: summaryBody
              });
            }

  code_scan:
    name: "Code Scan"
    uses: "./.github/workflows/codeql.yml"
    permissions:
      security-events: write
      actions: read
      contents: read
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    steps:
      - uses: RuggeroVisintin/release-please-action@main
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@master
        with:
          name: coverage-badge-artifact
          path: .github/pages/badges/coverage.badge.svg
      - name: install
        run: npm ci
      - name: build web bundle
        run: npm run build
      - name: build lib
        run: npm run build:lib
      - name: upload release artifact
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czvf "${{ steps.release.outputs.tag_name }}-jsbundle.tar.gz" -C dist/jsbundle .
          tar -czvf "${{ steps.release.outputs.tag_name }}-lib.tar.gz" -C dist/lib .
          gh release upload ${{ steps.release.outputs.tag_name }} "${{ steps.release.outputs.tag_name }}-jsbundle.tar.gz"
          gh release upload ${{ steps.release.outputs.tag_name }} "${{ steps.release.outputs.tag_name }}-lib.tar.gz"
      - name: build docs
        id: docs
        if: ${{ steps.release.outputs.prs_created != true || steps.release.outputs.releases_created == true }}
        run: |
          npm run build:docs
          mkdir -p .github/pages/
          cp -r docs/tsdoc/* .github/pages/
          echo "docs_created=true" >> "$GITHUB_OUTPUT"
      - name: Setup Pages
        if: ${{ steps.docs.outputs.docs_created }}
        uses: actions/configure-pages@v5
      - name: upload docs artifact
        if: ${{ steps.docs.outputs.docs_created }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: docs-pages
          path: ".github/pages/"
      - name: deploy docs artifact
        if: ${{ steps.docs.outputs.docs_created }}
        uses: actions/deploy-pages@v4
        with:
          artifact_name: docs-pages
    needs: [test_unit, test_visual, build, code_scan]
    if: github.ref_name == 'main'
