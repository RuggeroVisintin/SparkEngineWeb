name: Continuos Integration
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: build
        run: npm run build

  test_unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: npm ci

      - name: test
        run: npm run test:unit:ci

      - name: issue badge
        run: |
          mkdir -p .github/pages/badges
          npx make-coverage-badge --report-path .coverage/coverage-summary.json --output-path .github/pages/badges/coverage.badge.svg

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-badge-artifact
          path: .github/pages/badges/coverage.badge.svg

  test_perf:
    name: Performance Tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: npm ci

      - name: test
        id: perf_test
        run: |
          npm run test:perf:ci

      - name: attach report
        if: github.event.number
        uses: thollander/actions-comment-pull-request@v2
        with:
          pr_number: ${{ github.event.number }}
          filePath: .benchmark
          mode: recreate
          comment_tag: benchmark_comment
          create_if_not_exists: true

  test_visual:
    name: Visual Tests
    permissions:
      pull-requests: write
      contents: read
    uses: ./.github/workflows/visual-tests-only.yml
    with:
      pr_number: ${{ github.event.number }}
      ref: ${{ github.sha }}
      event_name: ${{ github.event_name }}
    secrets: inherit

  test_eslint:
    name: Eslint Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: npm ci

      - name: test
        run: npm run test:eslint-rules:ci

  test-breaking-changes:
    name: Test Breaking Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to post comments on the PR

    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Needed so we can fetch/checkout main easily

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Breaking Change Report
        run: |
          npm run test:breaking-changes

      - name: Annotate Source Files with API Changes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');

            const diffPath = 'test-results/backward-compatibility/reports/api-diff-report.md';
            if (!fs.existsSync(diffPath)) return;

            const diffText = fs.readFileSync(diffPath, 'utf8');
            if (!diffText || diffText.trim() === '') return;

            // 1. Extract exact changed declarations/signatures from the unified diff
            const changedSignatures = new Set();
            const lines = diffText.split('\n');
            for (const line of lines) {
              if ((line.startsWith('+') && !line.startsWith('+++')) || (line.startsWith('-') && !line.startsWith('---'))) {
                const content = line.substring(1).trim();
                if (content && !content.startsWith('#') && !content.startsWith('//') && content !== '}' && content !== '{' && content.length > 4) {
                  const tokens = content.split(/[\s(:<>]+/);
                  const identifier = tokens.find(t => t && /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(t) && !['get', 'export', 'readonly', 'public', 'private', 'protected', 'static', 'interface', 'class', 'type', 'enum', 'function', 'const', 'let', 'var'].includes(t));
                  
                  if (identifier) {
                    changedSignatures.add(identifier);
                  }
                }
              }
            }

            console.log("Filtered target API identifiers:", Array.from(changedSignatures));

            // 2. Scan modified source files in the PR to find matches and annotate them
            const filesInPR = cp.execSync('git diff --name-only origin/main...HEAD').toString().split('\n').filter(f => f.startsWith('src/') && (f.endsWith('.ts') || f.endsWith('.tsx')));

            for (const file of filesInPR) {
              if (!fs.existsSync(file)) continue;
              const fileContent = fs.readFileSync(file, 'utf8');
              const fileLines = fileContent.split('\n');
              
              let lineNum = 1;
              for (const fileLine of fileLines) {
                for (const sig of changedSignatures) {
                  if (fileLine.includes(sig)) {
                    console.log(`Annotating ${file}:${lineNum} for API change on '${sig}'`);
                    core.warning(`API contract change detected for '${sig}'. Ensure backwards compatibility.`, {
                      file: file,
                      startLine: lineNum,
                      title: '⚠️ API Breaking Change'
                    });
                  }
                }
                lineNum++;
              }
            }

  code_scan:
    name: "Code Scan"
    uses: "./.github/workflows/codeql.yml"
    permissions:
      security-events: write
      actions: read
      contents: read
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    steps:
      - uses: RuggeroVisintin/release-please-action@main
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@master
        with:
          name: coverage-badge-artifact
          path: .github/pages/badges/coverage.badge.svg
      - name: install
        run: npm ci
      - name: build web bundle
        run: npm run build
      - name: build lib
        run: npm run build:lib
      - name: upload release artifact
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czvf "${{ steps.release.outputs.tag_name }}-jsbundle.tar.gz" -C dist/jsbundle .
          tar -czvf "${{ steps.release.outputs.tag_name }}-lib.tar.gz" -C dist/lib .
          gh release upload ${{ steps.release.outputs.tag_name }} "${{ steps.release.outputs.tag_name }}-jsbundle.tar.gz"
          gh release upload ${{ steps.release.outputs.tag_name }} "${{ steps.release.outputs.tag_name }}-lib.tar.gz"
      - name: build docs
        id: docs
        if: ${{ steps.release.outputs.prs_created != true || steps.release.outputs.releases_created == true }}
        run: |
          npm run build:docs
          mkdir -p .github/pages/
          cp -r docs/tsdoc/* .github/pages/
          echo "docs_created=true" >> "$GITHUB_OUTPUT"
      - name: Setup Pages
        if: ${{ steps.docs.outputs.docs_created }}
        uses: actions/configure-pages@v5
      - name: upload docs artifact
        if: ${{ steps.docs.outputs.docs_created }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: docs-pages
          path: ".github/pages/"
      - name: deploy docs artifact
        if: ${{ steps.docs.outputs.docs_created }}
        uses: actions/deploy-pages@v4
        with:
          artifact_name: docs-pages
    needs: [test_unit, test_visual, build, code_scan]
    if: github.ref_name == 'main'
